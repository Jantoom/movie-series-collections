name: Build and deploy collections

on:
  schedule:
    - cron: "17 18 * * 0"   # weekly, Sundays 18:17 UTC (4:17am Monday Brisbane)
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["collections.config.mjs", "src/**", "scripts/**", "wrangler.jsonc", ".github/workflows/**"]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      # The addon's address is the custom domain in wrangler.jsonc.
      - name: Read the addon's address
        run: node -e 'const m = require("fs").readFileSync("wrangler.jsonc", "utf8").match(/"pattern":\s*"([^"]+)"/); console.log(`SITE_URL=https://${m[1]}`)' >> "$GITHUB_ENV"

      - name: Build addon
        run: node scripts/build.mjs

      # A failed test or build stops here, so the last good deployment stays up.
      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
